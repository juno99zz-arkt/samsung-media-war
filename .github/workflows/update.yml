name: Samsung vs Union News Update

on:
  schedule:
    # KST 07:00 = UTC 22:00 (전날), 평일(월~금)만
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic requests beautifulsoup4 yt-dlp

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: auto update $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
